# Masari CI — contracts: specs/001-platform-foundation/contracts/ci.md
# Every job is a required status check (docs/repo-settings.md). The `e2e` job is added in PR-10.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Gates 1–3. `pnpm i18n:check` is added in PR-7 and `pnpm rtl:check` in PR-8.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    # Gate 4. The PostgreSQL service is used from PR-3 on.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masari_owner
          POSTGRES_PASSWORD: masari_dev_owner
          POSTGRES_DB: masari
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masari_owner -d masari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # CI-only throwaway values (contracts/ci.md §2); not secrets.
    env:
      APP_ENV: test
      APP_URL: http://localhost:3100
      DATABASE_URL: postgres://masari_web:masari_dev_web@localhost:5432/masari
      DATABASE_MIGRATION_URL: postgres://masari_owner:masari_dev_owner@localhost:5432/masari
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      EMAIL_TRANSPORT: capture
      EMAIL_FROM: 'Masari <no-reply@localhost>'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    # Gate 5. No application environment variables on purpose: the build must not need them.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  secrets:
    # Gate 7. Full history is fetched so gitleaks can scan every commit of the pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits through the API (read-only).
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_ENABLE_COMMENTS: false

  audit:
    # Gate 8. On an upstream advisory follow contracts/ci.md §2 — never add ignores here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
